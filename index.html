<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>ThinkBetAI - AI Sports Betting Analytics & Odds Intelligence Platform</title>
    <meta name="title" content="ThinkBetAI - AI Sports Betting Analytics & Odds Intelligence Platform" />
    <meta name="description" content="Make smarter sports betting decisions with AI-powered analytics. Get real-time odds comparisons, injury reports, matchup analysis, and data-driven insights for NFL, NBA, UFC, Soccer, and more." />
    <meta name="keywords" content="sports betting analytics, AI betting predictions, odds comparison, sports betting AI, NFL betting odds, NBA betting analysis, UFC fight predictions, soccer betting tips, injury reports, matchup analysis, betting intelligence, sports data analytics, live odds, betting insights, sports betting platform" />
    <meta name="author" content="ThinkBetAI" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://thinkbetai.com" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ThinkBetAI" />
    <meta property="og:url" content="https://thinkbetai.com" />
    <meta property="og:title" content="ThinkBetAI - AI Sports Betting Analytics & Odds Intelligence" />
    <meta property="og:description" content="Make smarter sports betting decisions with AI-powered analytics. Real-time odds, injury reports, and data-driven insights for NFL, NBA, UFC, Soccer & more." />
    <meta property="og:image" content="https://thinkbetai.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@thinkbetai" />
    <meta name="twitter:url" content="https://thinkbetai.com" />
    <meta name="twitter:title" content="ThinkBetAI - AI Sports Betting Analytics & Odds Intelligence" />
    <meta name="twitter:description" content="Make smarter sports betting decisions with AI-powered analytics. Real-time odds, injury reports, and data-driven insights." />
    <meta name="twitter:image" content="https://thinkbetai.com/og-image.png" />
    
    <!-- Additional SEO Meta Tags -->
    <meta name="theme-color" content="#8B5CF6" />
    <meta name="application-name" content="ThinkBetAI" />
    <meta name="apple-mobile-web-app-title" content="ThinkBetAI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "ThinkBetAI",
      "url": "https://thinkbetai.com",
      "logo": "https://thinkbetai.com/logo.png",
      "description": "AI-powered sports betting analytics platform providing real-time odds, injury reports, and data-driven insights.",
      "sameAs": [
        "https://twitter.com/thinkbetai"
      ]
    }
    </script>
    
    <!-- Structured Data - WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ThinkBetAI",
      "url": "https://thinkbetai.com",
      "description": "AI Sports Betting Analytics & Odds Intelligence Platform",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://thinkbetai.com/games?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    
    <!-- Structured Data - SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ThinkBetAI",
      "applicationCategory": "SportsApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "description": "AI-powered sports betting analytics with real-time odds comparison, injury reports, and matchup analysis for NFL, NBA, UFC, Soccer, and more.",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "ratingCount": "150"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
